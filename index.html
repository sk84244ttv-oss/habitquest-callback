<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Back to HabitOS</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #07090A; color: #fff; font-family: -apple-system, system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: rgba(255,255,255,0.6); margin: 0 0 24px; font-size: 15px; }
  a { display: inline-block; padding: 15px 28px; border-radius: 30px; background: #2BE07F; color: #000;
      font-weight: 700; font-size: 16px; text-decoration: none; }
</style>
</head>
<body>
<div>
  <h1>Bank connected</h1>
  <p>Returning to HabitOS… If nothing happens, tap the button.</p>
  <a id="open" href="habitquest://bank-callback">Open HabitOS</a>
</div>
<script>
  // Passes the bank's result (?code=…&state=…) to the app. Nothing is stored or sent anywhere else.
  // HabitOS Flow (the second app) marks its logins with state=flow-…, so both apps can be installed side by side.
  var state = new URLSearchParams(window.location.search).get("state") || "";
  var scheme = state.indexOf("flow-") === 0 ? "habitflow" : "habitquest";
  var target = scheme + "://bank-callback" + window.location.search;
  document.getElementById("open").setAttribute("href", target);
  window.location.replace(target);
</script>
</body>
</html>
